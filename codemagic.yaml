workflows:
  # ============================================
  # WORKFLOW 1: Feature Branch (Solo Tests + Crear PR)
  # ============================================
  feature-branch-workflow:
    name: Feature Branch CI (Tests Only)
    instance_type: mac_mini_m2
    max_build_duration: 30

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'feature/*'
          include: true
      cancel_previous_builds: true

    environment:
      groups:
        - firebase_credentials
        - github_credentials
      vars:
        PACKAGE_NAME: "com.example.cicdexample"
        FLUTTER_VERSION: "3.9.0"
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: com.bps.horacioduca.cicdexample

    scripts:
      - name: Validate feature branch base (must be from develop)
        script: |
          git fetch origin develop --depth=1
          if ! git merge-base --is-ancestor FETCH_HEAD HEAD; then
            echo "❌ La rama actual no tiene como base 'develop'."
            echo "💡 Crea la rama desde develop: git checkout develop && git pull && git checkout -b feature/tu-rama"
            exit 1
          fi

      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Run tests
        script: |
          flutter test

      - name: Create GitHub Pull Request
        script: |
          if [ -z "$GITHUB_TOKEN" ]; then
            echo "⚠️  GITHUB_TOKEN no configurado, saltando creación de PR"
            exit 0
          fi

          if ! command -v gh &> /dev/null; then
            brew install gh
          fi

          export GH_TOKEN="$GITHUB_TOKEN"
          BRANCH_NAME=${CM_BRANCH}
          BASE_BRANCH="develop"
          FEATURE_NAME=${BRANCH_NAME#feature/}

          EXISTING_PR=$(gh pr list --repo $CM_REPO_SLUG --head $BRANCH_NAME --base $BASE_BRANCH --json number --jq '.[0].number' 2>/dev/null || echo "")

          if [ -n "$EXISTING_PR" ]; then
            echo "✅ PR #$EXISTING_PR ya existe para esta rama"
          else
            gh pr create \
              --repo $CM_REPO_SLUG \
              --base $BASE_BRANCH \
              --head $BRANCH_NAME \
              --title "QA Review: $FEATURE_NAME" \
              --body "🚀 **PR creado automáticamente por CI/CD**

            **Rama:** \`$BRANCH_NAME\`
            **Estado:** Tests pasados ✅

            Esperando merge a \`develop\` para generar builds y distribución a QA.

            ---
            _Este PR fue creado automáticamente por el workflow de CI/CD_" \
              && echo "✅ PR creado exitosamente" \
              || echo "⚠️  No se pudo crear el PR"
          fi

    artifacts:
      - flutter_drive.log

    # ⚠️ No publica a Firebase en este workflow

  # ============================================
  # WORKFLOW 2: Merge a Develop (Builds Completos + Publicación)
  # ============================================
  merge-to-develop-workflow:
    name: Merge to Develop (Build & Distribute)
    instance_type: mac_mini_m2
    max_build_duration: 60

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: develop
          include: true
      cancel_previous_builds: true

    environment:
      groups:
        - firebase_credentials
        - github_credentials
      vars:
        PACKAGE_NAME: "com.example.cicdexample"
        FLUTTER_VERSION: "3.9.0"
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Verify push is from merged PR
        script: |
          COMMIT_SHA=${CM_COMMIT:-$(git rev-parse HEAD)}
          echo "🔍 Commit actual: $COMMIT_SHA"

          if [ -z "$GITHUB_TOKEN" ]; then
            echo "⚠️  GITHUB_TOKEN no configurado; no puedo validar PR. Continuando..."
            exit 0
          fi

          if ! command -v gh &> /dev/null; then
            brew install gh
          fi

          export GH_TOKEN="$GITHUB_TOKEN"

          PR_NUMBER=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/$CM_REPO_SLUG/commits/$COMMIT_SHA/pulls" \
            --jq '.[0].number' 2>/dev/null || echo "")

          if [ -z "$PR_NUMBER" ]; then
            echo "⏸️  No se encontró PR mergeado asociado al commit. Saltando build."
            exit 0
          fi

          PR_DATA=$(gh pr view "$PR_NUMBER" --repo "$CM_REPO_SLUG" --json merged,headRefName,baseRefName 2>/dev/null || echo "")
          MERGED=$(echo "$PR_DATA" | jq -r '.merged // false')
          HEAD_REF=$(echo "$PR_DATA" | jq -r '.headRefName // ""')
          BASE_REF=$(echo "$PR_DATA" | jq -r '.baseRefName // ""')

          if [ "$MERGED" != "true" ]; then
            echo "⏸️  El PR #$PR_NUMBER no está mergeado. Saltando build."
            exit 0
          fi

          if [ "$BASE_REF" != "develop" ]; then
            echo "⏸️  El PR #$PR_NUMBER no apunta a develop (base: $BASE_REF). Saltando build."
            exit 0
          fi

          if [[ "$HEAD_REF" != feature/* ]]; then
            echo "⏸️  El PR #$PR_NUMBER no viene de una rama feature/* (head: $HEAD_REF). Saltando build."
            exit 0
          fi

          echo "✅ PR #$PR_NUMBER mergeado encontrado. Procediendo con build..."
          echo "PR_NUMBER=$PR_NUMBER" >> $CM_ENV

      - name: Setup Firebase configuration files
        script: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "✅ google-services.json creado desde variable de entorno"
          elif [ -n "$GOOGLE_SERVICE_JSON" ]; then
            echo "$GOOGLE_SERVICE_JSON" > android/app/google-services.json
            echo "✅ google-services.json creado desde variable de entorno (fallback)"
          else
            echo "❌ ERROR: Variables GOOGLE_SERVICES_JSON o GOOGLE_SERVICE_JSON no están configuradas"
            exit 1
          fi

          mkdir -p android/app/src/production/release
          mkdir -p android/app/src/release
          mkdir -p android/app/src/production
          mkdir -p android/app/src/productionRelease

          cp android/app/google-services.json android/app/src/production/release/google-services.json
          cp android/app/google-services.json android/app/src/release/google-services.json
          cp android/app/google-services.json android/app/src/production/google-services.json
          cp android/app/google-services.json android/app/src/productionRelease/google-services.json

          if [ -n "$GOOGLE_SERVICE_INFO_PLIST" ]; then
            mkdir -p ios/Runner
            echo "$GOOGLE_SERVICE_INFO_PLIST" > ios/Runner/GoogleService-Info.plist
            echo "✅ GoogleService-Info.plist creado desde variable de entorno"
          else
            echo "⚠️  GOOGLE_SERVICE_INFO_PLIST no está configurado (iOS fallará si intentas compilar IPA)"
          fi

      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Run tests
        script: |
          flutter test

      - name: Increment build number
        script: |
          CURRENT_BUILD=$(grep 'version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f2)
          NEW_BUILD=$((CURRENT_BUILD + 1))
          VERSION_NAME=$(grep 'version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)

          sed -i.bak "s/version: .*/version: $VERSION_NAME+$NEW_BUILD/" pubspec.yaml

          echo "Build number incrementado: $CURRENT_BUILD -> $NEW_BUILD"
          echo "NEW_BUILD_NUMBER=$NEW_BUILD" >> $CM_ENV

      - name: Build Android APK
        script: |
          flutter build apk --release --build-number=$NEW_BUILD_NUMBER

      - name: Build Android App Bundle
        script: |
          flutter build appbundle --release --build-number=$NEW_BUILD_NUMBER

      - name: Prepare iOS code signing
        script: |
          if ! command -v keychain >/dev/null 2>&1 || ! command -v xcode-project >/dev/null 2>&1; then
            echo "ℹ️  Instalando codemagic-cli-tools..."
            brew install codemagic-cli-tools
          fi

          keychain initialize
          keychain add-certificates
          xcode-project use-profiles

      - name: Build iOS IPA
        script: |
          flutter build ipa --release --build-number=$NEW_BUILD_NUMBER

      - name: Create release notes
        script: |
          PR_NUMBER=${PR_NUMBER:-"N/A"}
          AUTHOR=$(git log -1 --pretty=%an 2>/dev/null || echo "Unknown")
          COMMIT_MSG=$(git log -1 --pretty=%B 2>/dev/null || echo "")

          {
            echo "🚀 Build generado automáticamente tras merge a develop"
            echo ""
            echo "• PR: #$PR_NUMBER"
            echo "• Rama: ${CM_BRANCH}"
            echo "• Autor: $AUTHOR"
            echo "• Build Number: $NEW_BUILD_NUMBER"
            echo "• Commit: ${COMMIT_MSG}"
          } > release_notes.txt

          echo "✅ Release notes creadas"

    artifacts:
      - build/**/outputs/**/*.apk
      - build/**/outputs/**/*.aab
      - build/ios/ipa/*.ipa
      - release_notes.txt
      - flutter_drive.log

    publishing:
      firebase:
        firebase_service_account: $FIREBASE_SERVICE_ACCOUNT
        android:
          app_id: $FIREBASE_APP_ID_ANDROID
          groups:
            - qa-testers
          artifact_type: apk
        ios:
          app_id: $FIREBASE_APP_ID_IOS
          groups:
            - qa-testers

      email:
        recipients:
          - horacioduca23@gmail.com
        notify:
          success: true
          failure: true
          